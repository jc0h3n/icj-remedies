# Refetches the CD-ICJ corpus from Zenodo and the ICJ case lists, commits the refreshed extracts in data/, rebuilds
# the site data and publishes the site to GitHub Pages. Runs on every push to main, every Monday, and on demand.
name: Update and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run data
      # Keep the weekly corpus extract and the ICJ case lists in the repository, so the
      # history builds up and a failed source never blanks the site. Pushes with GITHUB_TOKEN don't retrigger this workflow.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Weekly data update ($(date -u +%Y-%m-%d))"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
